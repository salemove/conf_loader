name: Publish Gem

on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # v7.0.1. The release needs these credentials: the action's entrypoint
      # runs `git fetch origin refs/tags/vX`, then `rake release` pushes the
      # tag. Nothing here uploads an artifact, so .git cannot leak that way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 2


      - name: Release Gem
        uses: discourse/publish-rubygems-action@b55d7b91b55e61752dc6cbc2972f8e16fe6c1a02
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          RUBYGEMS_API_KEY: ${{secrets.RUBYGEMS_API_KEY}}
          RELEASE_COMMAND: rake release
